<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carbon | Disable Windows Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020202;
            --accent: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.25);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --card-bg: #0a0a0b;
            --border: rgba(255, 0, 127, 0.2);
            --success: #00ff88;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 60px 80px;
            line-height: 1.8;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(255, 0, 127, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 0% 100%, rgba(255, 0, 127, 0.02) 0%, transparent 30%);
        }

        .container { max-width: 850px; }

        .header-section { margin-bottom: 50px; }
        h1 {
            font-size: 42px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        h1 span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        .download-zone {
            margin: 40px 0;
            padding: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-icon { color: var(--accent); font-size: 24px; }

        .btn-download {
            background: var(--accent);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5); }

        .steps-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .step {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .step-number {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-family: 'JetBrains Mono';
            font-weight: 700;
            font-size: 14px;
        }

        .instruction { font-size: 16px; color: var(--text-main); }
        .instruction b { color: var(--accent); }

        .status-display {
            margin-top: 50px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .status-display img {
            width: 100%;
            display: block;
            filter: grayscale(0.2);
        }

        .status-caption {
            background: var(--success);
            color: #000;
            padding: 8px 20px;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            position: absolute;
            top: 15px;
            right: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <h1>Disable <span>Windows Updates</span></h1>
        </div>

        <div class="download-zone">
            <div class="file-info">
                <div class="file-icon">📁</div>
                <div>
                    <div style="font-weight: 700;">Update Blocker.zip</div>
                    <div style="font-size: 12px; color: var(--text-dim);">Size: 1MB • Archive</div>
                </div>
            </div>
            <a href="https://1747526905-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FIRlbgGEe6FZJRx7luQsK%2Fuploads%2Fnw7IXNyBm4O8MaKr94cJ%2FUpdate%20Blocker.zip?alt=media&token=658c03b1-f99a-4830-836d-d562a904559d" class="btn-download">
                DOWNLOAD NOW
            </a>
        </div>

        <div class="steps-box">
            <div class="step">
                <div class="step-number">1</div>
                <div class="instruction">Download <b>Update Blocker</b> using the button above.</div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div class="instruction">Unzip the downloaded files to your desktop.</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="instruction">Run the executable <b>Wub_x64.exe</b>.</div>
            </div>
            <div class="step">
                <div class="step-number">4</div>
                <div class="instruction">Select <b>Disable Windows Updates</b> and click <b>Apply Now</b>.</div>
            </div>
        </div>

        <div class="status-display">
            <div class="status-caption">Updates Disabled</div>
            <img src="https://content.gitbook.com/content/Mahy4lFQYb5rf7TZw9lo/blobs/Efv9x712vZZGnPPJ6RiA/image.png" alt="Update Blocker Disabled Status">
        </div>
    </div>

</body>
</html>
