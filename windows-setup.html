<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carbon | Windows Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.2);
            --text-main: #ffffff;
            --text-dim: #888;
            --card-bg: #070708;
            --border: rgba(255, 0, 127, 0.15);
            --blue-link: #3b82f6;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 60px 80px;
            line-height: 1.7;
            background-image: radial-gradient(circle at 0% 0%, rgba(255, 0, 127, 0.03) 0%, transparent 40%);
        }

        .container { max-width: 900px; }

        h1 {
            font-size: 48px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        h1 span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

        h2 { font-size: 28px; margin-top: 60px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .setup-warning {
            background: rgba(255, 0, 127, 0.05);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin: 30px 0;
            font-weight: 600;
        }

        .media-container {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin: 25px 0;
            overflow: hidden;
            max-width: 100%;
        }
        .media-container img, .media-container video { width: 100%; display: block; opacity: 0.9; }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 30px 0;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .instruction-text {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        b { color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Windows <span>Setup</span></h1>

        <div class="setup-warning">
            Do These Exact Steps (Don't Connect To Internet Until You've Finished The Setup)
        </div>

        <div class="video-box">
            <iframe src="https://streamable.com/e/8w2pxa" allowfullscreen></iframe>
        </div>

        <div class="instruction-text">
            Do <b>NOT</b> login to Microsoft (Example below):
        </div>

        <div class="media-container">
            <img src="https://content.gitbook.com/content/Mahy4lFQYb5rf7TZw9lo/blobs/TJoQGJUpbTs1YdWPSd9S/image.png" alt="Do Not Login Microsoft Example">
        </div>
    </div>

</body>
</html>
